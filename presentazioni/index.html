<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Il Distruttore nella Kolbrin | Fetonte il Distruttore</title>
<meta name="description" content="Documentario Fetonte: immagini illustrative sincronizzate con il copione.">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#07121f;color:#f6f0e6;overflow:hidden}
main{position:relative;width:100%;height:100dvh;display:grid;place-items:center;outline:none}
.slide{position:absolute;inset:0;display:none;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at center,#18334b 0%,#07121f 72%);animation:fade .55s ease both}
.slide.active{display:flex}
.slide img{display:block;max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain}
.slide--originale{background:radial-gradient(ellipse at center,#253b54 0%,#07121f 70%)}
.slide--originale img{width:min(82vw,100vh);height:min(82vw,100vh);object-fit:contain;filter:drop-shadow(0 20px 60px #0009)}
.slide--illustrata img{width:min(100vw,140vh);height:100%;object-fit:contain}
@keyframes fade{from{opacity:0;filter:brightness(.85)}to{opacity:1;filter:brightness(1)}}
@media(prefers-reduced-motion:reduce){.slide{animation:none}}
</style>
</head>
<body>
<main id="stage" tabindex="-1" aria-live="off">
  <!-- Prima scena del documentario: immagine effettivamente generata e caricata nel repository.
       Nessun testo in sovrimpressione: la narrazione è nel copione separato. -->
  <section class="slide slide--illustrata active" aria-label="Codice antico sotto il cielo in fiamme — illustrazione generata">
    <img src="immagini/Codice%20antico%20sotto%20il%20cielo%20in%20fiamme.png" alt="Libro antico e corpo celeste infuocato sopra un paesaggio storico immaginario">
  </section>
</main>
<script>
const slides=[...document.querySelectorAll('.slide')];let index=0;
const channel=new BroadcastChannel('fetonte-presentazione');
function show(n){index=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,i)=>{s.classList.toggle('active',i===index);s.setAttribute('aria-hidden',i!==index)});history.replaceState(null,'','#'+(index+1));localStorage.setItem('fetonte-slide',String(index));channel.postMessage({type:'slide',index})}
window.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(index+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(index-1)}else if(e.key==='Home')show(0);else if(e.key==='End')show(slides.length-1);else if(e.key.toLowerCase()==='f')(document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen())});
document.getElementById('stage').addEventListener('pointerdown',()=>document.getElementById('stage').focus());
show((parseInt(location.hash.slice(1),10)||1)-1);
document.getElementById('stage').focus({preventScroll:true});
</script>
</body></html>
