<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Copione del documentario | Fetonte</title><style>:root{font-family:system-ui,sans-serif;color-scheme:dark}body{margin:0;background:#111c29;color:#f3f3f3;padding:clamp(18px,4vw,55px)}header{position:sticky;top:0;background:#111c29;border-bottom:1px solid #526171;padding:3px 0 6px}h1{font-size:.16rem;margin:0 0 1px;font-weight:600}#count{color:#e9bd76;font-size:.14rem}article{max-width:850px;font-size:.75rem;line-height:1.55;padding-top:10px}article h2{color:#e9bd76;font-size:1.2em}article p{margin:.8em 0}.hint{color:#a9b9c9;font-size:.9rem}button{background:#253e56;color:white;border:1px solid #8293a3;border-radius:8px;padding:8px 14px;cursor:pointer}</style></head><body><header><h1>Fetonte — Copione del relatore</h1><div id="count">Diapositiva 1 di 3</div></header><article id="script"></article><script>
const texts=[
['Apertura — Il Distruttore nella Kolbrin','Il nostro canale si occupa di catastrofismo. Nelle nostre analisi e nel nostro lavoro di reverse engineering utilizziamo spesso i testi della Bibbia di Kolbrin, nei quali abbiamo trovato descrizioni di un misterioso asteroide distruttore.'],
['La discussione in ambito accademico','Questa scelta viene spesso criticata in ambito accademico. Si ritiene, infatti, che la Bibbia di Kolbrin non presenti le caratteristiche necessarie per essere considerata una fonte di valore storico.'],
['Perché considero interessante la Kolbrin','In questo video vorrei spiegare come, esaminando i contenuti della Bibbia di Kolbrin, sia arrivato a una conclusione: questi racconti sono estremamente interessanti e difficili da classificare semplicemente come composizioni poetiche o testi di fantasia. Ritengo elevata la probabilità che provengano da un passato molto lontano.']
];
function show(i){i=Math.max(0,Math.min(texts.length-1,Number(i)||0));document.getElementById('count').textContent='Diapositiva '+(i+1)+' di '+texts.length;document.getElementById('script').innerHTML='<h2>'+texts[i][0]+'</h2><p>'+texts[i][1]+'</p>'}
const channel=new BroadcastChannel('fetonte-presentazione');channel.onmessage=e=>{if(e.data&&e.data.type==='slide')show(e.data.index)};
window.addEventListener('storage',e=>{if(e.key==='fetonte-slide')show(e.newValue)});
show(localStorage.getItem('fetonte-slide')||0);
</script></body></html>
