<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Copione | Fetonte</title><style>:root{font-family:system-ui,sans-serif;color-scheme:dark}body{margin:0;background:#111c29;color:#f3f3f3;padding:clamp(18px,4vw,55px)}header{position:sticky;top:0;background:#111c29;border-bottom:1px solid #526171;padding:10px 0 20px}h1{font-size:1.3rem;margin:0 0 10px}#count{color:#e9bd76}article{max-width:850px;font-size:clamp(1.3rem,2.6vw,2.3rem);line-height:1.55;padding-top:25px}article h2{color:#e9bd76;font-size:1.2em}article p{margin:.8em 0}.hint{color:#a9b9c9;font-size:.9rem}button{background:#253e56;color:white;border:1px solid #8293a3;border-radius:8px;padding:8px 14px;cursor:pointer}</style></head><body><header><h1>Fetonte — Copione del relatore</h1><div id="count">Diapositiva 1 di 4</div><p class="hint">Questa finestra non deve essere catturata da OBS. Si aggiorna quando avanzi nella presentazione.</p><button onclick="document.querySelector('article').style.fontSize='2.6rem'">Testo grande</button> <button onclick="document.querySelector('article').style.fontSize='1.5rem'">Testo piccolo</button></header><article id="script"></article><script>
const texts=[
['Le catastrofi dell’Età del Bronzo','Benvenuti su Fetonte il Distruttore. In questa prova vogliamo mostrare come una presentazione possa accompagnare un racconto dal vivo. Il nostro percorso mette a confronto testimonianze antiche, dati archeologici e ipotesi di ricerca. Non tutte le catastrofi descritte dalle fonti devono necessariamente riferirsi allo stesso evento.'],
['Un solo evento o catastrofi differenti?','Nel quarto capitolo del Book of Gleanings, la Kolbrin racconta il diluvio di Sisuda e descrive l’arrivo del Distruttore. La somiglianza con altre tradizioni del diluvio merita un confronto attento. Dobbiamo però distinguere ciò che dice il testo dalle nostre interpretazioni e verificare separatamente le cronologie.'],
['Quattro momenti da distinguere','Osserviamo questa cronologia. Intorno al 2900 avanti Cristo collochiamo, come ipotesi di lavoro, il diluvio di Ziusudra. Verso il 2350 avanti Cristo troviamo un’altra proposta di evento catastrofico, discussa in relazione agli studi di Courty. Intorno al 2200 avanti Cristo si colloca la crisi climatica detta del 4,2 ka. Infine, il progetto indaga un possibile passaggio di Fetonte intorno al 2100 avanti Cristo. Sono quattro riferimenti distinti: le loro eventuali connessioni restano da dimostrare.'],
['La ricerca continua','Questa è soltanto una dimostrazione della nostra nuova regia web. Il vantaggio è poter mostrare fonti, mappe e cronologie mentre raccontiamo, e conservare poi le stesse presentazioni come documenti consultabili sul sito. Nei prossimi episodi approfondiremo le singole testimonianze.']
];
function show(i){i=Math.max(0,Math.min(texts.length-1,Number(i)||0));document.getElementById('count').textContent='Diapositiva '+(i+1)+' di '+texts.length;document.getElementById('script').innerHTML='<h2>'+texts[i][0]+'</h2><p>'+texts[i][1]+'</p>'}
const channel=new BroadcastChannel('fetonte-presentazione');channel.onmessage=e=>{if(e.data&&e.data.type==='slide')show(e.data.index)};
window.addEventListener('storage',e=>{if(e.key==='fetonte-slide')show(e.newValue)});
show(localStorage.getItem('fetonte-slide')||0);
</script></body></html>
