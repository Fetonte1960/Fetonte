<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Presentazione del documentario Gli Argonauti nel lago Tritonide, Fetonte il Distruttore.">
<title>Gli Argonauti nel lago Tritonide — Fetonte</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;--bg:#07121f;--text:#f6f0e6;--gold:#e8b96e}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text)}
main{height:100dvh;width:100vw;position:relative;outline:none;overflow:hidden}
.slide{position:absolute;inset:0;display:none;background:radial-gradient(ellipse at 50% 43%,#19354a 0%,#07121f 77%);overflow:hidden}
.slide.active{display:flex;animation:fade .45s ease both}
.slide--image{align-items:center;justify-content:center}
.slide--image img{height:100%;width:100%;object-fit:cover;object-position:center;display:block}
.slide--image img[hidden]{display:none}
.slide--text{align-items:center;justify-content:center;padding:5vh 5.5vw}
.sheet{width:100%;height:100%;max-width:1800px;display:flex;flex-direction:column;justify-content:center;gap:min(2vh,28px)}
.sheet-title{flex:0 0 auto;text-align:center;color:var(--gold);font-weight:500;font-size:clamp(25px,3.2vw,64px);line-height:1.15}
.sheet-title:empty,.source:empty{display:none}
.sheet-text{flex:1 1 auto;min-height:0;width:100%;font-family:Georgia,"Times New Roman",serif;line-height:1.13;text-align:center;display:flex;align-items:center;justify-content:center}
.sheet-text span{display:block;width:100%;white-space:pre-line;overflow-wrap:break-word;hyphens:auto;font-size:92px}
.source{flex:0 0 auto;text-align:right;font-family:Georgia,serif;font-size:clamp(18px,1.4vw,27px);color:#d6dce5;font-style:italic}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.slide.active{animation:none}}
</style>
<script src="./scene.js"></script>
</head>
<body>
<main id="stage" tabindex="-1" aria-label="Presentazione cinematografica"></main>
<script>
(function(){
"use strict";
const scenes=window.FETONTE_ARGONAUTI_SCENE||[];
const stage=document.getElementById("stage");
const key="fetonte:argonauti-tritonide:slide";
const channelName="fetonte:argonauti-tritonide:sync";
let channel=null,index=0;
try{if(window.BroadcastChannel)channel=new BroadcastChannel(channelName);}catch(e){}
const slides=scenes.map(function(data,i){
 const node=document.createElement("section");node.className="slide "+(data.kind==="image"?"slide--image":"slide--text");
 node.setAttribute("aria-label","Scena "+(i+1));
 if(data.kind==="image"){
  if(data.src){const img=document.createElement("img");img.src=data.src;img.alt=data.alt||"Immagine della scena";img.addEventListener("error",function(){img.hidden=true;});node.appendChild(img);}
 }else{
  const sheet=document.createElement("div");sheet.className="sheet";
  const title=document.createElement("div");title.className="sheet-title";title.textContent=data.title||"";
  const body=document.createElement("div");body.className="sheet-text";
  const span=document.createElement("span");span.textContent=data.text||"";body.appendChild(span);
  const source=document.createElement("div");source.className="source";source.textContent=data.source||"";
  sheet.append(title,body,source);node.appendChild(sheet);
 }
 stage.appendChild(node);return node;
});
function sizeText(){
 const active=slides[index];if(!active||!active.classList.contains("slide--text"))return;
 const parent=active.querySelector(".sheet-text"),span=parent.querySelector("span");
 if(!span.textContent.trim())return;
 const scale=Math.min(innerWidth/1920,innerHeight/1080);
 let low=20,high=Math.max(38,210*scale);
 for(let i=0;i<19;i++){const test=(low+high)/2;span.style.fontSize=test+"px";
  if(span.scrollHeight<=parent.clientHeight-3&&span.scrollWidth<=parent.clientWidth+2)low=test;else high=test;
 }
 span.style.fontSize=low+"px";
}
function show(n,notify){
 if(!slides.length)return;
 index=Math.max(0,Math.min(slides.length-1,Number(n)||0));
 slides.forEach(function(s,i){s.classList.toggle("active",i===index);s.setAttribute("aria-hidden",String(i!==index));});
 try{history.replaceState(null,"","#"+(index+1));}catch(e){}
 try{localStorage.setItem(key,String(index));}catch(e){}
 if(notify!==false&&channel){try{channel.postMessage({type:"slide",index:index});}catch(e){}}
 requestAnimationFrame(sizeText);
}
if(channel)channel.onmessage=function(e){if(e.data&&e.data.type==="slide")show(e.data.index,false);};
window.addEventListener("storage",function(e){if(e.key===key)show(e.newValue,false);});
window.addEventListener("resize",function(){requestAnimationFrame(sizeText);});
window.addEventListener("keydown",function(e){
 if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();show(index+1,true);}
 else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();show(index-1,true);}
 else if(e.key==="Home"){e.preventDefault();show(0,true);}
 else if(e.key==="End"){e.preventDefault();show(slides.length-1,true);}
 else if(e.key.toLowerCase()==="f"){e.preventDefault();if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(function(){});}
});
stage.addEventListener("pointerdown",function(){stage.focus();});
let start=parseInt(location.hash.slice(1),10);
if(!Number.isFinite(start)){try{start=1+(Number(localStorage.getItem(key))||0);}catch(e){start=1;}}
show((start||1)-1,false);stage.focus({preventScroll:true});
})();
</script>
</body></html>
