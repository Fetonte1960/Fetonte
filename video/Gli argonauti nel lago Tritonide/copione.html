<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Copione — Gli Argonauti nel lago Tritonide | Fetonte</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:#111c29;color:#f6f0e6;padding:clamp(14px,3vw,42px)}
header{position:sticky;top:0;background:#111c29;border-bottom:1px solid #455667;padding:5px 0 12px;z-index:1}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
small{font-size:.78rem;color:#b7c5d4}
#count{font-size:.88rem;color:#e8b96e}
nav{display:flex;align-items:center;gap:8px}
button{cursor:pointer;border:1px solid #677c8e;background:#253e56;color:#f6f0e6;border-radius:8px;padding:8px 13px;font-size:1rem}
button:hover{background:#36546d}
main{max-width:1000px;margin:24px auto}
h1{font-size:clamp(1.1rem,2vw,1.7rem);font-weight:600;line-height:1.35;margin:0;color:#e8b96e}
article{font-size:1.55rem;line-height:1.6;white-space:pre-line;margin-top:18px}
.help{font-size:.86rem;color:#9daebe;margin-top:3rem;line-height:1.6}
</style>
<script src="./scene.js"></script>
</head>
<body>
<header><div class="head">
 <div><small>Fetonte · Copione del relatore</small><div id="count">Scena 1</div></div>
 <nav aria-label="Navigazione scene">
  <button id="previous" aria-label="Scena precedente">←</button>
  <button id="next" aria-label="Scena successiva">→</button>
  <button id="smaller" aria-label="Riduci caratteri">A−</button>
  <button id="larger" aria-label="Ingrandisci caratteri">A+</button>
 </nav>
</div></header>
<main><h1 id="scene-title"></h1><article id="script"></article>
<p class="help">Questa finestra è sincronizzata con la presentazione dello stesso sito. Usa ←/→ oppure i pulsanti per passare alla scena precedente o successiva. Non includerla nella registrazione OBS.</p></main>
<script>
(function(){
"use strict";
const scenes=window.FETONTE_ARGONAUTI_SCENE||[];
const key="fetonte:argonauti-tritonide:slide",channelName="fetonte:argonauti-tritonide:sync";
const script=document.getElementById("script"),heading=document.getElementById("scene-title"),counter=document.getElementById("count");
let index=0,font=1.55,channel=null;
try{if(window.BroadcastChannel)channel=new BroadcastChannel(channelName);}catch(e){}
function show(n,notify){
 if(!scenes.length){heading.textContent="Copione in preparazione";return;}
 index=Math.max(0,Math.min(scenes.length-1,Number(n)||0));
 heading.textContent=scenes[index].scriptTitle||"Scena "+(index+1);
 script.textContent=scenes[index].script||"Testo da dettare.";
 counter.textContent="Scena "+(index+1)+" di "+scenes.length;
 try{localStorage.setItem(key,String(index));}catch(e){}
 if(notify!==false&&channel){try{channel.postMessage({type:"slide",index:index});}catch(e){}}
}
if(channel)channel.onmessage=function(e){if(e.data&&e.data.type==="slide")show(e.data.index,false);};
window.addEventListener("storage",function(e){if(e.key===key)show(e.newValue,false);});
document.getElementById("previous").onclick=function(){show(index-1,true);};
document.getElementById("next").onclick=function(){show(index+1,true);};
document.getElementById("smaller").onclick=function(){font=Math.max(.85,font-.15);script.style.fontSize=font+"rem";};
document.getElementById("larger").onclick=function(){font=Math.min(3.3,font+.15);script.style.fontSize=font+"rem";};
window.addEventListener("keydown",function(e){
 if(e.target.closest("button"))return;
 if(["ArrowRight","PageDown"].includes(e.key)){e.preventDefault();show(index+1,true);}
 else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();show(index-1,true);}
 else if(e.key==="Home"){e.preventDefault();show(0,true);}
 else if(e.key==="End"){e.preventDefault();show(scenes.length-1,true);}
});
let start=0;try{start=Number(localStorage.getItem(key))||0;}catch(e){}
show(start,false);
})();
</script></body></html>
